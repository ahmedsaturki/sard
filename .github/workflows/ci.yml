name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.4"
  # Memory limit for all jobs (shared hosting target)
  NODE_OPTIONS: "--max-old-space-size=512"

jobs:
  quality:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    # Use 1 CPU to simulate shared hosting single-core
    # GitHub Actions ubuntu-latest has 2 CPUs; we limit via taskset in steps
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        run: taskset -c 0 pnpm lint
      
      - name: Typecheck
        run: taskset -c 0 pnpm typecheck
      
      - name: Test (with coverage)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sard
          SARD_DB_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: taskset -c 0 pnpm test

  build:
    name: Build (512MB)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build all packages
        run: taskset -c 0 pnpm build
      
      - name: Check package sizes
        run: |
          for pkg in packages/*/package.json apps/*/package.json; do
            if [ -f "$pkg" ]; then
              name=$(jq -r '.name' "$pkg")
              if [[ "$name" != "sard/monorepo" ]]; then
                echo "Checking $name..."
                # Would check tarball size here
              fi
            fi
          done
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            packages/*/dist
            apps/lite/dist
            apps/lite/.next
          retention-days: 7

  perf:
    name: Performance (k6 100VU/512MB)
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'ahmedsaturki/sard' # Only run on main repo
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build
        run: taskset -c 0 pnpm build
      
      - name: Start Sard Lite
        run: |
          cd apps/lite
          NODE_OPTIONS="--max-old-space-size=512" taskset -c 0 pnpm start &
          sleep 15
          curl -f http://localhost:4321/health || exit 1
      
      - name: Run k6 load test
        run: |
          # Install k6
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
          
          # Run load test
          cd ${GITHUB_WORKSPACE}
          cat > load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export const options = {
            vus: 100,
            duration: '60s',
            thresholds: {
              http_req_duration: ['p(95)<100'],
              http_req_failed: ['rate<0.01'],
            },
          };
          
          export default function () {
            const res = http.get('http://localhost:4321/health');
            check(res, { 'status 200': (r) => r.status === 200 });
            sleep(0.1);
          }
          EOF
          
          taskset -c 0 k6 run load-test.js
      
      - name: Check results
        run: |
          echo "k6 test completed - check thresholds above"

  lighthouse:
    name: Lighthouse CI (98/100/100/100)
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'ahmedsaturki/sard'
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build
        run: taskset -c 0 pnpm build
      
      - name: Start Sard Lite
        run: |
          cd apps/lite
          NODE_OPTIONS="--max-old-space-size=512" taskset -c 0 pnpm start &
          sleep 15
          curl -f http://localhost:4321/health || exit 1
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4321/
            http://localhost:4321/posts
            http://localhost:4321/admin
            http://localhost:4321/api/sard/install
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          configPath: ./lighthouse-config.js

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: npm audit
        run: npm audit --audit-level=high --json > audit-report.json || true
      
      - name: Generate SBOM
        run: npx @cyclonedx/bom@latest -o sbom.json --include-dev=false
      
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 30
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

  # e2e tests (requires Playwright + system Chrome)
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build
        run: taskset -c 0 pnpm build
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start Sard Lite
        run: |
          cd apps/lite
          NODE_OPTIONS="--max-old-space-size=512" taskset -c 0 pnpm start &
          sleep 20
          curl -f http://localhost:4321/health || exit 1
      
      - name: Run Playwright tests
        run: |
          cd apps/lite
          npx playwright test --project=chromium
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: apps/lite/test-results/
          retention-days: 7
